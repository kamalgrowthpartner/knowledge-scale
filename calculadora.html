<script>
var APPS_SCRIPT_URL='https://script.google.com/macros/s/AKfycbyCTmRIKsWNYVTn7T_1WrDILuYL7jgN6bPeBZSgBpypBIjyizjxLFMRJVuQuXNzY-3-/exec';
var leadSent=false;

var N={
  fitness:{n:'Fitness',vps:0.12,benchK:14},
  coaching:{n:'Coaching',vps:0.18,benchK:22},
  negocios:{n:'Negocios',vps:0.22,benchK:28},
  marketing:{n:'Marketing',vps:0.20,benchK:26},
  finanzas:{n:'Finanzas',vps:0.28,benchK:35}
};

function upd(id,lbl,type){
  var v=parseFloat(document.getElementById(id).value);
  var el=document.getElementById(lbl);
  if(type==='k') el.textContent=v>=1000?(v/1000).toFixed(1)+'K':Math.round(v);
  else if(type==='eur') el.textContent=v>=1000?(v/1000).toFixed(1)+'K€':v+'€';
  else el.textContent=Math.round(v);
}

function fmt(n){
  if(n>=1000) return (Math.round(n/100)/10).toFixed(1).replace('.',',')+'K€';
  return Math.round(n)+'€';
}

function checkCapture(){
  var n=document.getElementById('c-nombre').value.trim();
  var e=document.getElementById('c-email').value;
  var p=document.getElementById('c-privacy').checked;
  document.getElementById('btn-capture').disabled=!(n.length>1&&e.includes('@')&&p);
}

['c-nombre','c-email'].forEach(function(id){
  document.getElementById(id).addEventListener('input',checkCapture);
});

document.getElementById('c-privacy').addEventListener('change',checkCapture);

function goCalc(){
  document.getElementById('s-capture').classList.remove('on');
  document.getElementById('s-calc').classList.add('on');
}

function doCalc(){
  var nk=document.getElementById('nicho').value;
  if(!nk)return null;
  
  var nd=N[nk];
  var seg=parseFloat(document.getElementById('seg').value);
  var ing=parseFloat(document.getElementById('ing').value);
  var reels=parseFloat(document.getElementById('reels').value);
  var tiempo=parseInt(document.getElementById('tiempo').value);

  var tiempoMult=[0.6,0.85,1.0,1.15][tiempo]||1;
  var reelsMult=1+Math.min(reels,14)*0.04;
  var potencial=Math.round(seg*nd.vps*tiempoMult*reelsMult);
  var perdida=Math.max(0,potencial-ing);
  var efi=potencial>0?Math.min(100,Math.round((ing/potencial)*100)):0;
  var score=Math.min(99,Math.round(efi*0.5+(reels/7)*25+(tiempo*5)));

  document.getElementById('r-perdida').textContent=perdida>0?fmt(perdida):'✓ OK';
  document.getElementById('r-perdida').className='r-val'+(perdida<50?' ok':'');
  document.getElementById('r-main').className='r-main'+(perdida<50?' ok':'');
  document.getElementById('r-desc').textContent=perdida>0?'Potencial: '+fmt(potencial)+'/mes':'Estás bien posicionado';
  
  document.getElementById('r-pot').textContent=fmt(potencial);
  document.getElementById('r-efi').textContent=efi+'%';
  document.getElementById('r-score').textContent=score;

  return {potencial:potencial,perdida:perdida,efi:efi,score:score};
}

function onTiempoChange(){
  // BLOQUEADOR: Si ya fue enviado, no hacer nada
  if(leadSent){
    console.log('Ya fue enviado, bloqueado');
    return;
  }
  
  var tiempo=document.getElementById('tiempo').value;
  var nicho=document.getElementById('nicho').value;
  
  // VALIDACION: Debe tener tanto tiempo como nicho
  if(!tiempo||!nicho){
    console.log('Faltan datos, abortando');
    return;
  }
  
  console.log('Enviando datos...');
  var result=doCalc();
  if(result){
    enviarASheets(result);
    leadSent=true; // MARCAR COMO ENVIADO INMEDIATAMENTE
  }
}

function enviarASheets(result){
  var payload={
    timestamp:new Date().toISOString(),
    nombre:document.getElementById('c-nombre').value.trim(),
    email:document.getElementById('c-email').value.trim(),
    nicho:document.getElementById('nicho').options[document.getElementById('nicho').selectedIndex].text,
    seguidores:document.getElementById('seg').value,
    ingresos:document.getElementById('ing').value,
    reels:document.getElementById('reels').value,
    tiempo:document.getElementById('tiempo').options[document.getElementById('tiempo').selectedIndex].text,
    potencial:String(result.potencial),
    perdida:String(result.perdida),
    eficiencia:String(result.efi),
    score:String(result.score)
  };
  
  var url=APPS_SCRIPT_URL+'?data='+encodeURIComponent(JSON.stringify(payload));
  var img=new Image();
  img.onload=function(){console.log('Enviado OK')};
  img.onerror=function(){console.log('Error enviando')};
  img.src=url;
}

upd('seg','lbl-seg','k');
upd('ing','lbl-ing','eur');
upd('reels','lbl-reels','n');
</script>
